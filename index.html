<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wise Toad</title>
  <meta name="description" content="A dark, moody, lo-fi pixel art scene featuring a meditating toad in a cluttered cyberpunk room at night.">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#101234}
    #canvasWrapper { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; z-index:0; }
    canvas#scene{image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;display:block; width:100%; height:100%;}
    #bubbleText, #sentMessage, #oldSentMessage {
      position: absolute;
      z-index: 2;
      display: none;
      color: #dde4ff;
      font-family: 'VT323', monospace;
      text-align: left;
      line-height: 0.85;
      padding: 0 2% 0.5%;
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: auto;
      text-shadow: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #sentMessage, #oldSentMessage {
      padding: 0 2%;
    }
    #bubbleText::-webkit-scrollbar, #sentMessage::-webkit-scrollbar, #oldSentMessage::-webkit-scrollbar {
      display: none;
    }
    #userInput {
      position: absolute;
      z-index: 0;
      background: transparent;
      border: none;
      color: #dde4ff;
      font-family: 'VT323', monospace;
      text-align: left;
      line-height: 0.85;
      padding: 0.5% 6% 0.5% 2%;
      overflow-y: auto;
      pointer-events: auto;
      text-shadow: none;
      resize: none;
      outline: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #userInput::-webkit-scrollbar { display: none; }
    #userInput::placeholder { color: #5b6a9a; }

    #sendBtn {
      position: absolute;
      z-index: 0;
      color: #6f7cae;
      font-family: 'VT323', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      text-shadow: none;
      user-select: none;
      transition: color 0.2s;
    }
    #sendBtn:hover { color: #aab6e4; }
    #sendBtn.active { color: #dde4ff; }

    /* --- previous exchanges: the SAME boxes, scrolled back into view ---
       Transparent DOM text (the pixel bubble behind it is drawn on the
       canvas, exactly like the live boxes). #histLayer is clipped by the
       wrapper's overflow:hidden, and sits below the live overlays (z:2). */
    #histLayer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .histMsg {
      position: absolute;
      display: none;
      flex-direction: column;
      justify-content: center;
      color: #dde4ff;
      font-family: 'VT323', monospace;
      text-align: left;
      line-height: 0.85;
      padding: 0 2%;
      overflow: hidden;
      pointer-events: auto;
      text-shadow: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    a.content-link {
      display: inline-block;
      margin-top: 8px;
      margin-bottom: 8px;
      margin-right: 8px;
      background: #1d2a52;
      border: 1px solid #46578f;
      color: #9fc0e8;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    a.content-link:hover {
      background: #243366;
      color: #bcd6f4;
      border-color: #5a6ca8;
    }

    /* inline bold inside replies */
    .md-b { color: #e6c468; }

    /* =====================================================================
       MOBILE LAYOUT  (portrait phones — toad small at bottom-right,
       input to its left, chat fills the space above)
       ===================================================================== */
    #mobile-chat,
    #toadCorner,
    #sceneTop,
    #inputBubbleBg, #toadCorner, #mobileThought {
      display: none;
    }

    @media (max-width: 768px) and (orientation: portrait) {
      html, body {
        display: block;
        overflow: hidden;
      }

      /* the whole scene fills the screen as the backdrop. The sky-blue background
         is insurance: if the two stacked canvases ever leave a sub-pixel gap at
         their join, sky (not black) shows through. */
      #canvasWrapper {
        position: fixed !important;
        inset: 0 !important;
        left: 0 !important;
        top: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 0;
        overflow: hidden !important;
        background: #101234;         /* seam insurance; JS sets the live SKY_MID inline */
      }
      /* Show the left portion of the field (≈ grid x:0–165) across the full width,
         anchored to the BOTTOM so the field fills the lower screen and the corner
         toad sits grounded on the grass. */
      canvas#scene {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 194vw !important;     /* 320/165 ≈ 1.94 → grid x:0–165 across the screen */
        height: auto !important;     /* keeps the 16:9 ratio (≈109vw tall) */
      }
      /* the sky, stacked on top of #scene to fill the rest of the screen.
         bottom = #scene's rendered height (194vw × 180/320 = 194vw × 0.5625) minus
         2px so the two canvases OVERLAP slightly (no gap line). Keep 194vw in sync. */
      #sceneTop {
        display: block;
        position: absolute;
        left: 0;
        bottom: calc(194vw * 0.5625 - 2px);
        width: 194vw;
        height: auto;
        image-rendering: pixelated;
        z-index: 0;
      }

      /* ONLY the toad — its own small canvas, bottom-right corner */
      #toadCorner {
        display: block;
        position: fixed;
        right: 4px;
        bottom: calc(4px + env(safe-area-inset-bottom));
        width: 84px;
        height: 98px;
        z-index: 3;
        image-rendering: pixelated;
        pointer-events: none;
      }

      /* Mobile thought cloud: floating high in the starry sky, well clear of chat */
      #mobileThought {
        display: block;
        position: fixed;
        top: 24%;
        right: 20px;
        width: 140px;
        height: 72px;
        z-index: 1;
        image-rendering: pixelated;
        pointer-events: none;
      }

      /* chat fills everything above the bottom strip (toad + input) */
      #mobile-chat {
        display: flex;
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        bottom: calc(108px + env(safe-area-inset-bottom));
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 12px 4px;
        gap: 0;
        z-index: 1;
      }

      .mobile-exchange {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 14px;
        animation: mobileExchangeEnter 0.45s ease-out;
      }
      /* Pins the whole stack to the bottom of the scroll area when the
         conversation is short (newest near the input), yet collapses to 0 so
         scrolling still works once messages overflow upward. */
      .mobile-exchange:first-child { margin-top: auto; }

      @keyframes mobileExchangeEnter {
        from { opacity: 0.3; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .mobile-msg {
        max-width: 88%;
        padding: 5px 16px;
        color: #dde4ff;
        font-family: 'VT323', monospace;
        line-height: 1.25;
        font-size: 19px;
        word-wrap: break-word;
        white-space: pre-wrap;
        text-shadow: none;
        position: relative;
      }

      .mobile-msg.user {
        align-self: flex-start;
        max-width: calc(100% - 94px);
        background: #1c2950;
        border: 2px solid #3a4c86;
        animation: mobileUserEnter 0.48s steps(8, end) forwards;
      }
      @keyframes mobileUserEnter {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.95);
          border-color: #829fd8;
        }
        35% {
          opacity: 0.75;
          transform: translateY(8px) scale(0.98);
          border-color: #6b85c8;
        }
        75% {
          opacity: 1;
          transform: translateY(-2px) scale(1.015);
          border-color: #5c74b2;
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          border-color: #3a4c86;
        }
      }
      .mobile-msg.user::after {
        content: '';
        position: absolute;
        bottom: 6px;
        left: -8px;
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-right: 8px solid #3a4c86;
      }
      .mobile-msg.user::before {
        content: '';
        position: absolute;
        bottom: 8px;
        left: -5px;
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-right: 6px solid #1c2950;
        z-index: 1;
      }
      .mobile-msg.toad {
        align-self: flex-end;
        background: #16224a;
        border: 2px solid #33437a;
        animation: mobileToadEnter 0.52s steps(8, end) forwards;
      }
      @keyframes mobileToadEnter {
        0%   { opacity: 0; transform: translateY(18px) scale(0.65); border-color: #829fd8; }
        25%  { opacity: 0.45; transform: translateY(10px) scaleX(0.85) scaleY(0.75); border-color: #829fd8; }
        50%  { opacity: 0.75; transform: translateY(4px) scaleX(0.96) scaleY(0.92); border-color: #5c74b2; }
        75%  { opacity: 0.95; transform: translateY(-2px) scaleX(1.02) scaleY(1.02); border-color: #445995; }
        100% { opacity: 1; transform: translateY(0) scale(1.0); border-color: #33437a; }
      }
      .mobile-msg.toad::after {
        content: '';
        position: absolute;
        bottom: 6px;
        right: -8px;
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 8px solid #33437a;
      }
      .mobile-msg.toad::before {
        content: '';
        position: absolute;
        bottom: 8px;
        right: -5px;
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 6px solid #16224a;
        z-index: 1;
      }
      .mobile-msg a { color: #9fc0e8; }
      .mobile-msg .content-link {
        font-size: 16px;
        padding: 3px 8px;
        margin-top: 6px;
        margin-bottom: 4px;
      }

      /* input sits at bottom-left, to the left of the toad. Its background is
         transparent: the pixel-art rounded bubble behind it (#inputBubbleBg)
         provides the same stepped-corner shape as the desktop canvas bubble. */
      #userInput {
        position: fixed !important;
        bottom: calc(30px + env(safe-area-inset-bottom));
        left: 8px;
        right: 124px;
        width: auto !important;
        height: 44px !important;
        top: auto !important;
        background: transparent;
        border: none;
        border-radius: 0;
        z-index: 2;
        font-size: 20px !important;
        padding: 8px 36px 8px 12px;
      }

      /* Pixel-art rounded input bubble — drawn on a tiny 64×10 canvas
         with the same blocky-corner primitives as the desktop bubble,
         then scaled up via image-rendering: pixelated. No anti-aliasing. */
      #inputBubbleBg {
        display: block;
        position: fixed;
        bottom: calc(30px + env(safe-area-inset-bottom));
        left: 8px;
        right: 124px;
        height: 44px;
        z-index: 1;
        pointer-events: none;
        image-rendering: pixelated;
      }

      #sendBtn {
        position: fixed !important;
        bottom: calc(30px + env(safe-area-inset-bottom));
        right: 98px;
        width: 30px !important;
        height: 44px !important;
        top: auto !important;
        left: auto !important;
        z-index: 2;
        font-size: 18px !important;
      }

      /* hide the desktop overlays */
      #bubbleText, #sentMessage, #oldSentMessage, #histLayer {
        display: none !important;
      }
    }
  </style>
</head>
<body>
<div id="canvasWrapper">
  <canvas id="scene"></canvas>
  <canvas id="sceneTop" width="320" height="180"></canvas>
  <div id="bubbleText"></div>
  <div id="sentMessage"></div>
  <div id="oldSentMessage"></div>
  <canvas id="inputBubbleBg" width="64" height="10"></canvas>
  <textarea id="userInput" placeholder="Speak to the Toad"></textarea>
  <div id="sendBtn" title="Send">&gt;</div>
  <div id="histLayer"></div>
</div>
<div id="mobile-chat"></div>
<canvas id="mobileThought" width="70" height="36"></canvas>
<canvas id="toadCorner" width="84" height="98"></canvas>
<script>
(() => {
  'use strict';

  /* =================================================================
     CANVAS SETUP
     ================================================================= */
  const C = document.getElementById('scene');
  let G = C.getContext('2d');           // `let`: swapped to the toad-corner ctx below
  const W = 320, H = 180;
  C.width = W; C.height = H;
  G.imageSmoothingEnabled = false;

  /* Mobile (portrait): the room renders fullscreen here, and the toad alone is
     re-rendered onto a small bottom-right canvas. Same media query as the CSS. */
  const MQ = window.matchMedia('(max-width: 768px) and (orientation: portrait)');
  const TC = document.getElementById('toadCorner');
  const GT = TC.getContext('2d');
  GT.imageSmoothingEnabled = false;
  /* translate so the toad's bounding box lands comfortably in the corner canvas */
  const TOAD_OX = 218, TOAD_OY = 69;   // centered & grounded on bottom grass
  function renderToadCorner(){
    GT.setTransform(1,0,0,1,0,0);
    GT.clearRect(0,0,TC.width,TC.height);
    GT.setTransform(1,0,0,1,-TOAD_OX,-TOAD_OY);
    const prev = G; G = GT;   // primitives (rv/d/…) draw to whatever G points at
    drawToad();
    G = prev;
  }

  /* Mobile: floating thought cloud canvas positioned high in the starry sky */
  const MTC = document.getElementById('mobileThought');
  const GMT = MTC.getContext('2d');
  GMT.imageSmoothingEnabled = false;
  function renderMobileThought(){
    GMT.clearRect(0, 0, MTC.width, MTC.height);
    if (!A.thinking && A.transPhase === 'IDLE') return;
    if (A.transPhase === 'BLOOMING' || A.transPhase === 'SETTLING') return;

    let scale = 1.0;
    let coreFlash = 0;
    let isIntro = false;

    if (A.thinking && A.thinkIntro < 1.0) {
      isIntro = true;
      // Cloud blooms in the sky after third-eye activates on corner toad
      const cloudIntroP = (A.thinkIntro - 0.20) / 0.75;
      if (cloudIntroP <= 0) return; // wait for third eye to flare first
      const p = Math.min(1.0, cloudIntroP);
      if (p < 0.15) {
        scale = 0.18; coreFlash = 0.9;
      } else if (p < 0.35) {
        scale = 0.42; coreFlash = 0.5;
      } else if (p < 0.55) {
        scale = 0.70; coreFlash = 0.2;
      } else if (p < 0.75) {
        scale = 0.90; coreFlash = 0.05;
      } else if (p < 0.90) {
        scale = 1.035; coreFlash = 0;
      } else {
        scale = 1.00; coreFlash = 0;
      }
    } else if (A.transPhase === 'CONDENSING') {
      const cp = Math.min(1, A.transTimer / 0.38);
      scale = Math.max(0.20, 1.0 - 0.80 * cp);
      coreFlash = Math.sin(cp * Math.PI);
    } else if (A.transPhase === 'STREAMING') {
      const sp = Math.min(1, A.transTimer / 0.32);
      scale = Math.max(0, 0.20 * (1 - sp));
      coreFlash = 0.5 * (1 - sp);
    }

    const prev = G; G = GMT;
    const floatY = (A.transPhase === 'IDLE') ? ((Math.sin(A.thinkTime * 1.5) * 1.2)|0) : 0;
    drawThoughtCloud(2, 3 + floatY, A.thinkTime, scale, coreFlash, isIntro);
    G = prev;
  }

  /* Mobile: pixel-art rounded input bubble — same blocky-corner pattern as
     drawUserBubble, drawn on a tiny canvas (64×10 internal) and scaled up by
     CSS with image-rendering: pixelated. No anti-aliasing = authentic pixel look. */
  const IB = document.getElementById('inputBubbleBg');
  const GI = IB.getContext('2d');
  GI.imageSmoothingEnabled = false;
  function drawInputBubble(){
    const fill = TH.ubFill, border = TH.ubBorder;
    const w = IB.width, h = IB.height;
    GI.clearRect(0,0,w,h);
    const prev = G; G = GI;
    rv(2,0,w-4,h,fill);
    rv(0,2,w,h-4,fill);
    rv(1,1,w-2,h-2,fill);
    rv(2,0,w-4,1,border); rv(2,h-1,w-4,1,border);
    rv(0,2,1,h-4,border); rv(w-1,2,1,h-4,border);
    d(1,0,border); d(0,1,border);
    d(w-2,0,border); d(w-1,1,border);
    d(1,h-1,border); d(0,h-2,border);
    d(w-2,h-1,border); d(w-1,h-2,border);
    G = prev;
  }

  /* Mobile only: an UPWARD extension of the room, stacked directly above #scene
     (same 320-wide grid + same CSS width, so wall/seams/pipe line up exactly).
     Its bottom edge (y=180) abuts the main scene's top edge (y=0). Drawn each
     frame via the same G-swap trick so the neon/LEDs can breathe. */
  const TOPC = document.getElementById('sceneTop');
  const GTop = TOPC.getContext('2d');
  GTop.imageSmoothingEnabled = false;
  function renderSceneTop(){
    GTop.setTransform(1,0,0,1,0,0);
    GTop.clearRect(0,0,TOPC.width,TOPC.height);
    const prev = G; G = GTop;
    drawSceneTop();
    G = prev;
  }
  /* Mobile: the sky continues upward above the field. #sceneTop sits directly
     above #scene, so its rows map to world-y (y - 180): the bottom row (y≈180)
     is worldY≈0 = drawSky()'s top colour, and it darkens smoothly toward the
     screen top. Sampling the SAME skyAt() makes the two canvases one seamless
     gradient — no value jump and no slope kink at the join. */
  function drawSceneTop(){
    const HT = 180;
    for (let y = 0; y < HT; y++) rv(0, y, W, 1, skyAt(y - 180));
    drawStarsTop();
    drawClouds(cloudsT);
  }

  /* =================================================================
     PALETTE
     ================================================================= */
  const P = {
    sky:   ['#050512','#070718','#0a0a22','#0e0e2c','#121038','#181248'],
    bFar:  ['#2d2245','#332850','#2a2040','#352a50'],
    bMid:  ['#1e1a35','#201c38','#1c1832'],
    bNear: ['#101020','#0e0e1c','#0c0c18'],
    wCyan:'#00ccee', wPink:'#dd4488', wOrange:'#dd8844',
    wWhite:'#99aacc', wYellow:'#ddcc66',
    fOut:'#5a3a14', fIn:'#7a5a28', fDk:'#3a1a08',
    wall:'#1a1a2e', wallM:'#1e1e32', wallL:'#222238',
    wallSide:'#141424',       /* left side-wall */
    floorD:'#2a1a10', floorM:'#3a2818', floorL:'#4a3828', floorLn:'#1e1208',
    crtB:'#2a2a3a', crtBD:'#1e1e2e', crtBT:'#32324a',
    shD:'#16100a', shM:'#2a1f14', shL:'#3d2b1f', shSide:'#100c06',
    tD:'#10281c', tM:'#1b3e2e', tL:'#27523c', tB:'#2d5e46', tE:'#070710',
    tSpot:'#0d2418', tBelly:'#2a5c46', tBelly2:'#326650', tWart:'#1d4636', tLid:'#0b2014',
    note:'#8888a0', pin:'#cc4444',
    spill:'#3e1212', cd:'#4a5588',
    cup:'#7a2828', straw:'#ccccbb',
    bottle:'#3a4a5a', bottleH:'#5a7a9a',
    bookA:'#665544', bookB:'#886655', bookC:'#aa7766', bookD:'#554433',
    /* --- peaceful grassy field (night) --- */
    hillFar:'#2e3a4a', hillNear:'#242e3c',
  };

  /* =================================================================
     THEME  (night — the only mode)
     Every colour the moonlit scene needs that isn't a gradient anchor (those
     are the SKY and GR consts below) or a toad/hill colour (those live in P).
     The field LAYOUT stores palette *indices* (ci/fi) resolved against
     GCOLS/FCOLS at draw time.
     ================================================================= */
  const TH = {
    grassTip:'#557064', stem:'#1c3a28',
    treeA:'#1c2a22', treeB:'#162018', treeC:'#101810',
    fencePost:'#2a2438', fenceRail:'#34304a', fenceDark:'#1e1a2a',
    horizonGlow:'rgba(120,130,180,0.22)', fieldPatch:'rgba(120,150,200,0.05)',
    cloudW:'#444c78', cloudSh:'#343a60',
    tbFill:'#16224a', tbBorder:'#33437a', ubFill:'#1c2950', ubBorder:'#3a4c86',
  };

  /* =================================================================
     SCENE CONFIG  (backend-ready)
     Lower angle + viewed from the right
     ================================================================= */
  const S = {
    win: { x:78, y:2, w:140, h:64 },
    ft: 3,
    pd: [124, 170],
    floorY: 80,
    sideWallW: 10,              /* visible left side-wall width */
    /* CRT TV — with 3D depth */
    tv: {
      stand: { x:12, y:66, w:68, h:12 },
      body:  { x:16, y:22, w:60, h:44 },
      screen:{ x:24, y:28, w:44, h:32 },
      dp: 4,
    },
    rcv: { x:18, y:12, w:56, h:10, dp:3 },
    /* bookshelf — with left-side 3D depth */
    shelf: { x:274, y:0, w:46, h:180, dp:5 },
    /* toad (slightly larger, prominent in lower-right). On mobile the corner
       render compensates via TOAD_OX, so this x only shifts the desktop toad. */
    toad: { x:225, y:72 },
    /* train */
    train: { y:24, w:55, h:4, speed:15 },
  };

  /* Desktop chat columns: user messages stay on the left (x:10); the toad's
     reply bubble + its history boxes sit in a right column anchored to the toad
     so the speech tail meets its jaw. TBUB_R is the toad bubble's right edge
     (= S.toad.x - 15, mirroring the original 170-vs-185 gap). On mobile these
     canvas bubbles aren't drawn, so this only affects desktop. */
  const TBUB_R = 210;
  const THIST_X = TBUB_R - 160;   // toad history box left edge (boxes are 160 wide)

  /* =================================================================
     DETERMINISTIC RANDOM
     ================================================================= */
  function mulberry(a){return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  /* =================================================================
     FIELD LAYOUT  (peaceful grassy field — generated once, deterministic)
     ================================================================= */
  const YH = 96;                                  // horizon: sky above, field below
  /* Sky/ground gradient anchors + grass/flower palettes (night). The field
     layout below stores palette indices (ci/fi) resolved against these. */
  const SKY_TOP=[6,8,28], SKY_MID=[16,18,52], SKY_HZ=[66,62,106];
  const GR_FAR=[40,52,60], GR_NEAR=[20,32,28];
  const GCOLS=['#1c3530','#223f34','#284b3a','#2f5742','#172c26'];

  /* --- Bresenham pixel-line (only draws within yMin..yMax) --- */
  function pxLine(x0,y0,x1,y1,c,yMin,yMax){
    x0|=0;y0|=0;x1|=0;y1|=0;
    const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
    const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
    let err=dx-dy;
    for(;;){
      if(y0>=yMin&&y0<=yMax&&x0>=0&&x0<W) d(x0,y0,c);
      if(x0===x1&&y0===y1) break;
      const e2=2*err;
      if(e2>-dy){err-=dy;x0+=sx}
      if(e2<dx){err+=dx;y0+=sy}
    }
  }

  /* ONE continuous sky gradient as a function of world-y: SKY_MID at the main
     scene's top (worldY 0) → SKY_HZ at the horizon (worldY = YH), extended
     linearly upward (negative worldY, used by the mobile #sceneTop) and clamped
     to gamut. Both #scene and #sceneTop sample this, so there is no seam. */
  function skyAt(wy){
    const t=wy/YH, cl=v=>v<0?0:v>255?255:v|0;
    return `rgb(${cl(SKY_MID[0]+(SKY_HZ[0]-SKY_MID[0])*t)},${cl(SKY_MID[1]+(SKY_HZ[1]-SKY_MID[1])*t)},${cl(SKY_MID[2]+(SKY_HZ[2]-SKY_MID[2])*t)})`;
  }

          d(fcx, fcy-1, '#e6c468'); d(fcx, fcy+1, '#e6c468');
        }
      } else if (step4 === 0) {
        d(fcx, fcy, '#e6c468');
      } else if (step4 === 1) {
        d(fcx, fcy, '#ffffff');
        d(fcx-1, fcy, '#78a0d0'); d(fcx+1, fcy, '#78a0d0');
        d(fcx, fcy-1, '#78a0d0'); d(fcx, fcy+1, '#78a0d0');
      } else if (step4 === 2) {
        d(fcx, fcy, '#e6c468');
        d(fcx-1, fcy, '#ffffff'); d(fcx+1, fcy, '#ffffff');
        d(fcx-2, fcy, 'rgba(160,216,239,0.6)'); d(fcx+2, fcy, 'rgba(160,216,239,0.6)');
        d(fcx, fcy-1, '#a0d8ef'); d(fcx, fcy+1, '#a0d8ef');
      } else {
        d(fcx, fcy, '#a0d8ef');
        d(fcx-1, fcy, 'rgba(120,160,220,0.4)'); d(fcx+1, fcy, 'rgba(120,160,220,0.4)');
      }
    }

    /* ambient highlight */
    rv(tx+22,ty+1,26,2,'rgba(80,120,200,0.18)');
    rv(tx+13,ty+4,8,2,'rgba(80,120,200,0.10)');
    rv(tx+49,ty+4,8,2,'rgba(80,120,200,0.10)');
    rv(tx+13,ty+15,17,8,'rgba(30,100,220,0.06)');

    /* ground shadow (ground stays locked to field y) */
    const groundTy = S.toad.y;
    rv(tx-3,groundTy+88,76,3, hoverY ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.30)');
    rv(tx+4,groundTy+90,62,2, hoverY ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.15)');
  }

  /* ---------- 15b. TOAD THOUGHT ANIMATION (deep cosmic contemplation) ---------- */
  function drawThoughtCloud(cx, cy, t, scale = 1.0, coreFlash = 0, isIntro = false){
    // Discrete stepped clock for authentic retro lofi aesthetic (6 fps & 4 fps)
    const step6 = (t * 6)|0;
    const step4 = (t * 4)|0;

    const fill = '#141e42';
    // Active celestial border highlight during entrance bloom
    const border = (isIntro && scale < 0.98) ? '#5c74b2' : '#33437a';
    const hl = (isIntro && scale < 0.98) ? '#a0d8ef' : '#4e6298';

    const midX = cx + 33;
    const midY = cy + 15;

    // Helper to draw scaled block centered around midX, midY
    const srv = (bx, by, bw, bh, col) => {
      if (scale >= 0.98) {
        rv(bx, by, bw, bh, col);
      } else {
        const nx = midX + Math.round((bx - midX) * scale);
        const ny = midY + Math.round((by - midY) * scale);
        const nw = Math.max(1, Math.round(bw * scale));
        const nh = Math.max(1, Math.round(bh * scale));
        rv(nx, ny, nw, nh, col);
      }
    };

    /* 1. Thought Cloud Body (organic pixel-art cloud silhouette) */
    // Ambient thought glow around cloud
    if (scale > 0.45) {
      srv(cx+3, cy+3, 60, 24, 'rgba(80,120,200,0.08)');
    }

    // Main cloud lobe blocks
    srv(cx+6, cy+5, 54, 20, fill);
    srv(cx+8, cy+2, 22, 10, fill);
    srv(cx+26, cy+1, 28, 12, fill);
    srv(cx+2, cy+8, 12, 14, fill);
    srv(cx+54, cy+8, 11, 14, fill);
    srv(cx+10, cy+22, 22, 6, fill);
    srv(cx+30, cy+23, 24, 5, fill);

    // Top cloud border & highlight lines
    srv(cx+9, cy+1, 20, 1, border);
    srv(cx+27, cy, 26, 1, border);
    srv(cx+3, cy+7, 6, 1, border);
    srv(cx+54, cy+7, 9, 1, border);
    // Top highlights (moonlight glint on cloud top)
    srv(cx+10, cy+2, 18, 1, hl);
    srv(cx+28, cy+1, 24, 1, hl);
    if (scale >= 0.9) {
      d(cx+4, cy+8, hl); d(cx+55, cy+8, hl);
    }

    // Left/Right side borders
    srv(cx+1, cy+9, 1, 12, border);
    srv(cx+65, cy+9, 1, 12, border);

    // Bottom borders
    srv(cx+3, cy+21, 8, 1, border);
    srv(cx+10, cy+28, 22, 1, border);
    srv(cx+30, cy+28, 25, 1, border);
    srv(cx+55, cy+22, 10, 1, border);

    /* 2. Mystical Contemplation Sequences (inside thought cloud) */
    if (isIntro && scale < 0.75) {
      // Early seedling of contemplation: radiant white/gold core
      d(midX, midY, '#ffffff');
      d(midX-1, midY, '#e6c468'); d(midX+1, midY, '#e6c468');
      d(midX, midY-1, '#78a0d0'); d(midX, midY+1, '#78a0d0');
    } else if (scale > 0.50) {
      const phase = ((t / 2.6)|0) % 3;

      if (phase === 0) {
        /* Sequence A: Cosmic Constellation & Neural Sparks */
        const n1x = cx + 16, n1y = cy + 14;
        const n2x = cx + 29, n2y = cy + 9;
        const n3x = cx + 45, n3y = cy + 11;
        const n4x = cx + 34, n4y = cy + 21;

        pxLine(n1x, n1y, n2x, n2y, 'rgba(100,130,200,0.3)', 0, H);
        pxLine(n2x, n2y, n3x, n3y, 'rgba(100,130,200,0.3)', 0, H);
        pxLine(n2x, n2y, n4x, n4y, 'rgba(100,130,200,0.3)', 0, H);
        pxLine(n1x, n1y, n4x, n4y, 'rgba(100,130,200,0.3)', 0, H);

        const drawStar = (sx, sy, seed) => {
          const s = (step6 + seed) % 4;
          if (s === 0) {
            d(sx, sy, '#ffffff');
          } else if (s === 1) {
            d(sx, sy, '#e6c468');
            d(sx-1, sy, '#78a0d0'); d(sx+1, sy, '#78a0d0');
            d(sx, sy-1, '#78a0d0'); d(sx, sy+1, '#78a0d0');
          } else if (s === 2) {
            d(sx, sy, '#a0d8ef');
          } else {
            d(sx, sy, '#78a0d0');
          }
        };
        drawStar(n1x, n1y, 0);
        drawStar(n2x, n2y, 1);
        drawStar(n3x, n3y, 2);
        drawStar(n4x, n4y, 3);

        const sparkT = (step6 % 12) / 12;
        let spx, spy;
        if (sparkT < 0.33) {
          const p = sparkT / 0.33;
          spx = (n1x + (n2x - n1x) * p)|0;
          spy = (n1y + (n2y - n1y) * p)|0;
        } else if (sparkT < 0.66) {
          const p = (sparkT - 0.33) / 0.33;
          spx = (n2x + (n3x - n2x) * p)|0;
          spy = (n2y + (n3y - n2y) * p)|0;
        } else {
          const p = (sparkT - 0.66) / 0.34;
          spx = (n3x + (n4x - n3x) * p)|0;
          spy = (n3y + (n4y - n3y) * p)|0;
        }
        d(spx, spy, '#ffffff');
        d(spx+1, spy, '#e6c468');

      } else if (phase === 1) {
        /* Sequence B: 8-bit Zen Galaxy Spiral (rotating at 6 fps) */
        const rot = step6 % 4;
        d(midX, midY, '#ffffff');
        d(midX-1, midY, '#e6c468'); d(midX+1, midY, '#e6c468');
        d(midX, midY-1, '#78a0d0'); d(midX, midY+1, '#78a0d0');

        if (rot === 0) {
          d(midX+3, midY-2, '#e6c468'); d(midX+4, midY-3, '#e6c468');
          d(midX-3, midY+2, '#e6c468'); d(midX-4, midY+3, '#e6c468');
          d(midX-2, midY-3, '#78a0d0'); d(midX-3, midY-4, '#78a0d0');
          d(midX+2, midY+3, '#78a0d0'); d(midX+3, midY+4, '#78a0d0');
        } else if (rot === 1) {
          d(midX+4, midY, '#e6c468'); d(midX+5, midY-1, '#e6c468');
          d(midX-4, midY, '#e6c468'); d(midX-5, midY+1, '#e6c468');
          d(midX, midY-4, '#78a0d0'); d(midX-1, midY-5, '#78a0d0');
          d(midX, midY+4, '#78a0d0'); d(midX+1, midY+5, '#78a0d0');
        } else if (rot === 2) {
          d(midX+2, midY+3, '#e6c468'); d(midX+3, midY+4, '#e6c468');
          d(midX-2, midY-3, '#e6c468'); d(midX-3, midY-4, '#e6c468');
          d(midX+3, midY-2, '#78a0d0'); d(midX+4, midY-3, '#78a0d0');
          d(midX-3, midY+2, '#78a0d0'); d(midX-4, midY+3, '#78a0d0');
        } else {
          d(midX, midY+4, '#e6c468'); d(midX-1, midY+5, '#e6c468');
          d(midX, midY-4, '#e6c468'); d(midX+1, midY-5, '#e6c468');
          d(midX+4, midY, '#78a0d0'); d(midX+5, midY-1, '#78a0d0');
          d(midX-4, midY, '#78a0d0'); d(midX-5, midY+1, '#78a0d0');
        }

        d(midX - 12 + ((step6 * 2) % 24), midY - 6, 'rgba(160,216,239,0.7)');
        d(midX + 12 - ((step6 * 2) % 24), midY + 6, 'rgba(230,196,104,0.7)');

      } else {
        /* Sequence C: Blooming Insight Lotus / Third Eye Glyph */
        const bloom = step4 % 4;
        rv(midX-4, midY+3, 9, 2, '#2f5742');
        rv(midX-6, midY+4, 13, 1, '#1c3530');
        d(midX, midY, '#e6c468');
        d(midX, midY-1, '#ffffff');

        if (bloom === 0) {
          rv(midX-2, midY-1, 5, 3, '#557064');
          d(midX, midY-2, '#9fc0e8');
        } else if (bloom === 1) {
          d(midX-3, midY, '#78a0d0'); d(midX+3, midY, '#78a0d0');
          d(midX-2, midY-2, '#9fc0e8'); d(midX+2, midY-2, '#9fc0e8');
          d(midX, midY-3, '#ffffff');
        } else if (bloom === 2) {
          d(midX-4, midY, '#9fc0e8'); d(midX+4, midY, '#9fc0e8');
          d(midX-3, midY-2, '#9fc0e8'); d(midX+3, midY-2, '#9fc0e8');
          d(midX-1, midY-3, '#e6c468'); d(midX+1, midY-3, '#e6c468');
          d(midX, midY-4, '#ffffff');
        } else {
          d(midX-5, midY, '#e6c468'); d(midX+5, midY, '#e6c468');
          d(midX-3, midY-3, '#a0d8ef'); d(midX+3, midY-3, '#a0d8ef');
          d(midX, midY-5, '#ffffff');
          d(midX-1, midY-1, '#e6c468'); d(midX+1, midY-1, '#e6c468');
        }
      }
    } else {
      /* Condensed Wisdom Core Pearl */
      const pearlR = Math.max(2, (scale * 9)|0);
      rv(midX - pearlR, midY - pearlR, pearlR * 2 + 1, pearlR * 2 + 1, '#16224a');
      rv(midX - pearlR + 1, midY - pearlR + 1, (pearlR - 1) * 2 + 1, (pearlR - 1) * 2 + 1, '#e6c468');
      d(midX, midY, '#ffffff');
      d(midX-1, midY, '#ffffff'); d(midX+1, midY, '#ffffff');
      d(midX, midY-1, '#ffffff'); d(midX, midY+1, '#ffffff');
    }

    /* 3. Drifting stardust motes */
    for (let i = 0; i < 3; i++) {
      const mx = (midX - 15 + ((t * 8 + i * 15)|0) % 30);
      const my = (midY - 12 - ((t * 6 + i * 9)|0) % 12);
      d(mx, my, (i === 1) ? '#e6c468' : '#a0d8ef');
    }

    /* 4. Radiant Epiphany Flash */
    if (coreFlash > 0.05) {
      const b = Math.max(1, (coreFlash * 12)|0);
      rv(midX - b, midY, b * 2 + 1, 1, '#ffffff');
      rv(midX, midY - b, 1, b * 2 + 1, '#ffffff');
      d(midX - b + 1, midY - b + 1, '#e6c468');
      d(midX + b - 1, midY - b + 1, '#e6c468');
      d(midX - b + 1, midY + b - 1, '#e6c468');
      d(midX + b - 1, midY + b - 1, '#e6c468');
    }
  }

  /* Desktop thought animation: lowered on screen to sit comfortably below user's message */
  function drawThought(){
    if (MQ.matches) return; // on mobile handled by renderMobileThought()
    if (!A.thinking && A.transPhase === 'IDLE') return;
    if (A.transPhase === 'BLOOMING' || A.transPhase === 'SETTLING') return;

    const tx = S.toad.x, ty = S.toad.y;
    const t = A.thinkTime;
    const floatY = (A.transPhase === 'IDLE') ? ((Math.sin(t * 1.5) * 1.2)|0) : 0;

    const cy = Math.max(66, (A.sentText ? (A.sentBoxY + A.sentTh + 8) : 66)) + floatY;
    const cx = 142;

    const step4 = (t * 4)|0;
    const step6 = (t * 6)|0;

    const isIntro = (A.thinking && A.thinkIntro < 1.0);
    let scale = 1.0;
    let coreFlash = 0;
    let streamProg = -1;

    if (isIntro) {
      // Thought entrance bloom across 0.85s
      const p = A.thinkIntro;
      if (p < 0.38) {
        scale = 0; // wait for orbs to sprout first
      } else {
        const cp = (p - 0.38) / 0.62; // 0 -> 1
        if (cp < 0.15) {
          scale = 0.18;
          coreFlash = 0.9; // birth flash!
        } else if (cp < 0.35) {
          scale = 0.42;
          coreFlash = 0.5;
        } else if (cp < 0.55) {
          scale = 0.70;
          coreFlash = 0.2;
        } else if (cp < 0.75) {
          scale = 0.90;
          coreFlash = 0.05;
        } else if (cp < 0.90) {
          scale = 1.035; // gentle elastic overshoot bounce
          coreFlash = 0;
        } else {
          scale = 1.00;
          coreFlash = 0;
        }
      }
    } else if (A.transPhase === 'CONDENSING') {
      const cp = Math.min(1, A.transTimer / 0.38);
      scale = Math.max(0.20, 1.0 - 0.80 * cp);
      coreFlash = Math.sin(cp * Math.PI);
    } else if (A.transPhase === 'STREAMING') {
      scale = 0.20;
      streamProg = Math.min(1, A.transTimer / 0.32);
    }

    /* Rising thought orbs: arcing from toad's left temple across to the thought cloud */
    // Connector 1: near toad head
    const o1x = (tx + 10 + (Math.cos(t * 2.0) * 0.8)|0);
    const o1y = (cy + 10 + (Math.sin(t * 2.5) * 1.0)|0);
    if (!isIntro || A.thinkIntro >= 0.12) {
      if (isIntro && A.thinkIntro < 0.22) {
        d(o1x+1, o1y+1, '#ffffff'); // sprouting glint
      } else {
        const o1Glow = (streamProg >= 0.65);
        if (o1Glow) {
          rv(o1x-1, o1y-1, 5, 5, '#ffffff');
          d(o1x, o1y, '#e6c468');
        } else {
          rv(o1x, o1y, 3, 3, '#16224a');
          rv(o1x, o1y, 3, 1, '#33437a');
          rv(o1x, o1y+2, 3, 1, '#33437a');
          d(o1x+1, o1y+1, (step4 % 2 === 0) ? '#78a0d0' : '#a0d8ef');
        }
      }
    }

    // Connector 2: midway
    const o2x = (tx - 3 + (Math.cos(t * 1.8 + 1.0) * 1.2)|0);
    const o2y = (cy + 12 + (Math.sin(t * 2.2 + 1.2) * 1.2)|0);
    if (!isIntro || A.thinkIntro >= 0.24) {
      if (isIntro && A.thinkIntro < 0.35) {
        rv(o2x+1, o2y+1, 3, 3, '#ffffff'); // sprouting glint
      } else {
        const o2Glow = (streamProg >= 0.30 && streamProg < 0.70);
        if (o2Glow) {
          rv(o2x-1, o2y-1, 7, 7, '#ffffff');
          rv(o2x, o2y, 5, 5, '#e6c468');
          d(o2x+2, o2y+2, '#ffffff');
        } else {
          rv(o2x+1, o2y, 3, 5, '#16224a');
          rv(o2x, o2y+1, 5, 3, '#16224a');
          rv(o2x+1, o2y, 3, 1, '#33437a');
          rv(o2x+1, o2y+4, 3, 1, '#33437a');
          rv(o2x, o2y+1, 1, 3, '#33437a');
          rv(o2x+4, o2y+1, 1, 3, '#33437a');
          d(o2x+1, o2y+1, '#78a0d0');
          if ((step6 + 1) % 3 === 0) d(o2x+2, o2y+2, '#e6c468');
        }
      }
    }

    // Connector 3: just beside thought cloud
    const o3x = (tx - 16 + (Math.cos(t * 1.6 + 2.0) * 1.5)|0);
    const o3y = (cy + 14 + (Math.sin(t * 2.0 + 2.0) * 1.2)|0);
    if (!isIntro || A.thinkIntro >= 0.36) {
      if (isIntro && A.thinkIntro < 0.48) {
        rv(o3x+2, o3y+2, 3, 3, '#ffffff'); // sprouting glint
      } else {
        const o3Glow = (streamProg >= 0.0 && streamProg < 0.40);
        if (o3Glow) {
          rv(o3x-1, o3y-1, 9, 9, '#ffffff');
          rv(o3x, o3y, 7, 7, '#e6c468');
          d(o3x+3, o3y+3, '#ffffff');
        } else {
          rv(o3x+1, o3y, 5, 7, '#16224a');
          rv(o3x, o3y+1, 7, 5, '#16224a');
          rv(o3x+1, o3y, 5, 1, '#33437a');
          rv(o3x+1, o3y+6, 5, 1, '#33437a');
          rv(o3x, o3y+1, 1, 5, '#33437a');
          rv(o3x+6, o3y+1, 1, 5, '#33437a');
          d(o3x+2, o3y+2, '#78a0d0');
          d(o3x+3, o3y+2, '#a0d8ef');
        }
      }
    }

    // Traveling spark from brow to mouth when stream completes
    if (streamProg >= 0.75) {
      const spFrac = (streamProg - 0.75) / 0.25;
      const sparkY = (ty + 8 + spFrac * 17)|0;
      d(tx + 35, sparkY, '#ffffff');
      d(tx + 34, sparkY, '#e6c468'); d(tx + 36, sparkY, '#e6c468');
    }

    if (scale > 0) {
      drawThoughtCloud(cx, cy, t, scale, coreFlash, isIntro);
    }
  }

  /* ---------- 16. ambient / post-processing (cool, moonlit, peaceful) ---------- */
  function drawAmbient(){
    /* Top-edge effects (cool moon wash + top vignette) only on desktop: on
       mobile the main scene's top edge is the *seam* with #sceneTop (mid-screen,
       not a real edge), so tinting it there would make a visible line. */
    if(!MQ.matches){
      rv(0,0,W,46,'rgba(120,140,210,0.05)');   // cool moonlight wash from the moon
      rv(0,0,90,30,'rgba(150,170,235,0.05)');
      rv(0,0,W,3,'rgba(6,8,24,0.22)');         // top vignette
    }
    /* gentle side/bottom vignette (real screen edges) */
    rv(0,H-4,W,4,'rgba(4,6,20,0.32)');
    rv(0,0,5,H,'rgba(6,8,24,0.22)');
    rv(W-5,0,5,H,'rgba(6,8,24,0.22)');
    /* blinking fireflies drifting over the field */
    motes.forEach(m=>{
      const x=(m.x+Math.sin(A.t*m.sp+m.phase)*m.drift)|0;
      let y=m.y-(A.t*3*m.sp); y=((y-YH)%(H-YH)+(H-YH))%(H-YH)+YH;
      const a=0.12+0.6*Math.max(0,Math.sin(A.t*2.2+m.phase));
      if(a>0.05) d(x,y|0,`rgba(196,238,150,${a.toFixed(2)})`);
    });
  }

  /* =================================================================
     ANIMATION UPDATE
     ================================================================= */
  function update(dt){
    A.t+=dt;
    A.sway+=dt*1.1;       // wind for the grass / flowers
    A.breath+=dt*1.4;     // toad breathing

    if (A.thinking) {
      A.thinkTime += dt;
      if (A.thinkIntro < 1.0) {
        A.thinkIntro = Math.min(1.0, A.thinkIntro + dt / 0.85);
      }
      if (A.toadAwake > 0) A.toadAwake = Math.max(0, A.toadAwake - dt * 2);
    }

    /* Seamless Multi-Stage Transition: CONDENSING -> STREAMING -> BLOOMING -> SETTLING */
    if (A.transPhase !== 'IDLE') {
      A.transTimer += dt;
      A.thinkTime += dt;

      if (A.transPhase === 'CONDENSING') {
        // Epiphany & Condensation (0.0s -> 0.38s)
        if (A.transTimer >= 0.38) {
          A.transPhase = 'STREAMING';
          A.transTimer = 0;
        }
      } else if (A.transPhase === 'STREAMING') {
        // Stream of insight down connectors to mouth (0.0s -> 0.32s)
        const sp = Math.min(1, A.transTimer / 0.32);
        if (sp >= 0.5) {
          A.toadAwake = Math.min(1, A.toadAwake + dt * 4);
        }
        if (sp >= 0.75) {
          A.mouthSpark = 1;
        }
        if (A.transTimer >= 0.32) {
          A.transPhase = 'BLOOMING';
          A.transTimer = 0;
          A.mouthSpark = 0;
          if (A.pendingReply) {
            const reply = A.pendingReply;
            A.pendingReply = null;
            if (MQ.matches) {
              const pinned = mobilePinnedBottom();
              const toadEl = mobileAppend(reply, 'toad');
              if (pinned) mobileScrollToTop(toadEl);
            } else {
              showText(reply);
            }
          }
        }
      } else if (A.transPhase === 'BLOOMING') {
        // Speech bubble bloom (0.0s -> 0.52s)
        const bp = Math.min(1, A.transTimer / 0.52);
        A.bubbleProgress = bp;
        if (A.transTimer >= 0.52) {
          A.transPhase = 'SETTLING';
          A.transTimer = 0;
          A.bubbleProgress = 1;
        }
      } else if (A.transPhase === 'SETTLING') {
        // Final settle & rest (0.0s -> 0.20s)
        if (A.transTimer >= 0.20) {
          A.transPhase = 'IDLE';
          A.transTimer = 0;
        }
      }
    } else if (A.bubbleTarget === 1) {
      // Toad stays serenely present while speaking
      A.toadAwake = Math.max(0.3, A.toadAwake - dt * 0.05);
    }

    /* Stepped, crisp pixel-art bubble entrance */
    if (A.bubbleTarget === 1) {
      const p = A.bubbleProgress;
      if (p <= 0) {
        A.bubbleFrame = 0;
      } else if (p < 0.15) {
        A.bubbleFrame = 0.18; // tiny horizontal seed
      } else if (p < 0.30) {
        A.bubbleFrame = 0.36; // horizontal unrolling
      } else if (p < 0.50) {
        A.bubbleFrame = 0.60; // vertical expanding
      } else if (p < 0.70) {
        A.bubbleFrame = 0.82; // vertical expansion reaching top
      } else if (p < 0.88) {
        A.bubbleFrame = 1.025; // gentle overshoot bounce
      } else {
        A.bubbleFrame = 1.00; // settled at full rest
      }
    } else if (A.bubbleTarget === 0) {
      if (A.bubbleProgress > 0) {
        A.bubbleProgress = Math.max(0, A.bubbleProgress - 0.25);
        A.bubbleFrame = A.bubbleProgress;
      } else {
        A.bubbleFrame = 0;
      }
    }

    /* User Input Sync (Always active) */
    const uInput = document.getElementById('userInput');
    const canvasH = document.getElementById('canvasWrapper').clientHeight;
    const scaleY = canvasH / H;
    A.scaleY = scaleY;
    uInput.style.fontSize = (6.5 * scaleY) + 'px';
    
    A.userTh = Math.max(10, Math.min(45, A.calcUTh || 10));
    const uTw = 160, uTh = A.userTh;
    const ubx = 10, uby = 170 - uTh;
    
    uInput.style.left = ((ubx / W) * 100) + '%';
    uInput.style.top = ((uby / H) * 100) + '%';
    uInput.style.width = ((uTw / W) * 100) + '%';
    uInput.style.height = ((uTh / H) * 100) + '%';
    
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.style.left = (((ubx + uTw - 16) / W) * 100) + '%';
    sendBtn.style.top = ((uby / H) * 100) + '%';
    sendBtn.style.width = ((16 / W) * 100) + '%';
    sendBtn.style.height = ((uTh / H) * 100) + '%';
    sendBtn.style.fontSize = (8 * scaleY) + 'px';

    /* sync DOM text */
    const bText = document.getElementById('bubbleText');
    if (A.bubbleFrame === 0 && A.chatState !== 'SWIPING_UP') {
      bText.style.display = 'none';
    } else {
      bText.style.display = 'flex';
      bText.style.flexDirection = 'column';

      let currentTopLimit = 5;
      const gap = 8;
      if (A.sentText) {
        // Limit toad growth so it never squashes the sent message
        currentTopLimit = Math.max(5, A.sentBoxY + A.sentRequestedTh + gap + 8);
      }
      A.targetTh = Math.min(A.requestedTh || 110, uby - currentTopLimit - gap);
      const textOverflows = A.requestedTh > A.targetTh + 0.5;
      bText.style.justifyContent = textOverflows ? 'flex-start' : 'center';

      const tw = A.targetTw || 160, th = A.targetTh;
      const f = A.bubbleFrame;
      const w = Math.round(tw * Math.min(1.02, f));
      const h = Math.round(th * Math.min(1.02, f));
      const bx = TBUB_R - w;

      /* Toad Bubble position */
      let anchorY = 100;
      const toadBottom = anchorY + (h * 0.36);
      if (toadBottom + gap > uby) {
        anchorY -= (toadBottom + gap - uby);
      }

      // Exclusion zone: prevent awkward tail intersections with rounded corners
      let proposedBottom = anchorY + (h * 0.36);
      if (proposedBottom >= 100 && proposedBottom <= 106) {
        anchorY -= (proposedBottom - 99);
      }

      A.anchorY = anchorY;
      let by = anchorY - (h * 0.64);

      // Physics: Sent message NEVER squashes.
      if (A.sentText && A.chatState !== 'SWIPING_UP') {
        A.sentTh = A.sentRequestedTh;

        // If the toad's top overlaps the sent message, push the toad down!
        const requiredBy = A.sentBoxY + A.sentTh + gap;
        if (by < requiredBy) {
          anchorY += (requiredBy - by);
          by = requiredBy;
          A.anchorY = anchorY;
        }
      }

      const wrapperH = document.getElementById('canvasWrapper').clientHeight;
      const scaleY = wrapperH / H;
      bText.style.fontSize = (6.5 * scaleY) + 'px';

      if (A.chatState === 'SWIPING_UP') {
        const fade = Math.max(0, Math.min(1, (A.oldBy + 40) / 60));
        bText.style.display = (A.oldBy < -120 || !A.oldTh || fade <= 0.02) ? 'none' : 'flex';
        bText.style.flexDirection = 'column';
        bText.style.justifyContent = 'center';
        bText.style.paddingTop = '';
        bText.style.left = ((A.oldBx / W) * 100) + '%';
        bText.style.top = ((A.oldBy / H) * 100) + '%';
        bText.style.width = ((A.oldTw / W) * 100) + '%';
        bText.style.height = ((A.oldTh / H) * 100) + '%';
        bText.style.opacity = fade.toFixed(2);
      } else {
        bText.style.left = ((bx / W) * 100) + '%';
        bText.style.top = (((by + A.scroll) / H) * 100) + '%';
        bText.style.width = ((w / W) * 100) + '%';
        bText.style.height = ((h / H) * 100) + '%';
        bText.style.paddingTop = textOverflows ? (4 * scaleY) + 'px' : '';

        // Clean text fade-in as bubble unfolds (no squished font distortion)
        if (A.bubbleProgress < 0.35) {
          bText.style.opacity = 0;
          bText.style.overflow = 'hidden';
        } else if (A.bubbleProgress < 0.9) {
          bText.style.opacity = ((A.bubbleProgress - 0.35) / 0.55).toFixed(2);
          bText.style.overflow = 'hidden';
        } else {
          bText.style.opacity = 1;
          bText.style.overflowY = textOverflows ? 'auto' : 'hidden';
        }
      }
    }

    // Animate SWIPING_UP with smooth retro momentum and tactile elastic cushion
    if (A.chatState === 'SWIPING_UP') {
      A.swipeProgress = Math.min(1.0, A.swipeProgress + dt / A.swipeDuration);
      const p = A.swipeProgress;

      let easeP;
      if (p < 0.85) {
        const t = p / 0.85;
        const t2 = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        easeP = t2 * 1.015;
      } else {
        const t = (p - 0.85) / 0.15;
        const settle = 1 - Math.pow(1 - t, 2);
        easeP = 1.015 - 0.015 * settle; // tactile cushion into rest
      }

      // 1. Sent user message ascends smoothly
      const targetSentY = 15;
      A.sentBoxY = A.sentBoxYStart + (targetSentY - A.sentBoxYStart) * easeP;
      A.sentTh = A.sentRequestedTh;

      // 2. Previous user message scrolls up into the sky and dissolves
      if (A.oldUserText && A.oldUserTh > 0) {
        A.oldUserBy = A.oldUserByStart - (50 * easeP);
      }

      // 3. Previous toad bubble ascends into the sky and dissolves
      if (A.oldTh > 0) {
        A.oldBy = A.oldByStart - (120 * easeP);
      }

      // 4. When swipe-up reaches resting position
      if (A.swipeProgress >= 1.0) {
        A.sentBoxY = targetSentY;
        A.bubbleFrame = 0;
        A.bubbleTarget = 0;
        A.bubbleProgress = 0;
        A.oldTh = 0;
        A.oldUserText = null;
        A.oldUserTh = 0;
        A.chatState = 'IDLE';

        if (A.pendingReply) {
          // Reply arrived during swipe-up; smoothly condense
          A.thinking = false;
          A.transPhase = 'CONDENSING';
          A.transTimer = 0;
        } else {
          // Enter thinking state with smooth, choreographed entrance animation
          A.thinking = true;
          A.thinkTime = 0;
          A.thinkIntro = 0;
          A.transPhase = 'IDLE';
          A.transTimer = 0;
          A.toadAwake = 0;
          A.mouthSpark = 0;
        }
      }
    }

    // Sync oldSentMessage DOM (previous user message scrolling up into history)
    const oldSentDom = document.getElementById('oldSentMessage');
    if (A.chatState === 'SWIPING_UP' && A.oldUserText && A.oldUserTh > 0) {
      oldSentDom.innerText = A.oldUserText;
      const oldFade = Math.max(0, Math.min(1, (A.oldUserBy + 25) / 35));
      oldSentDom.style.display = (A.oldUserBy < -80 || oldFade <= 0.02) ? 'none' : 'flex';
      oldSentDom.style.flexDirection = 'column';
      oldSentDom.style.justifyContent = 'center';
      oldSentDom.style.left = ((10 / W) * 100) + '%';
      oldSentDom.style.top = (((A.oldUserBy + A.scroll) / H) * 100) + '%';
      oldSentDom.style.width = ((160 / W) * 100) + '%';
      oldSentDom.style.height = ((A.oldUserTh / H) * 100) + '%';
      oldSentDom.style.opacity = oldFade.toFixed(2);
      const wrapperH = document.getElementById('canvasWrapper').clientHeight;
      const scaleY = wrapperH / H;
      oldSentDom.style.fontSize = (6.5 * scaleY) + 'px';
    } else if (oldSentDom) {
      oldSentDom.style.display = 'none';
    }

    // Sync sentMessage DOM (new user message)
    const sText = document.getElementById('sentMessage');
    if (A.sentText) {
      sText.style.display = 'flex';
      sText.style.flexDirection = 'column';
      sText.style.justifyContent = 'center';

      const sWidth = 160;
      const sbx = 10;

      sText.style.left = ((sbx / W) * 100) + '%';
      sText.style.top = (((A.sentBoxY + A.scroll) / H) * 100) + '%';
      sText.style.width = ((sWidth / W) * 100) + '%';
      sText.style.height = ((A.sentTh / H) * 100) + '%';

      const wrapperH = document.getElementById('canvasWrapper').clientHeight;
      const scaleY = wrapperH / H;
      sText.style.fontSize = (6.5 * scaleY) + 'px';
    } else {
      sText.style.display = 'none';
    }

    /* scroll-back: ease the view offset, then place the past boxes */
    A.scroll += (A.scrollTarget - A.scroll) * Math.min(1, dt * 15);
    if (Math.abs(A.scrollTarget - A.scroll) < 0.3) A.scroll = A.scrollTarget;
    syncHistory();
  }

  /* ---------- 16. text bubble ---------- */
  function drawBubble(){
    let f, tw, th, bx, by;
    const fill = TH.tbFill, border = TH.tbBorder;

    if (A.chatState === 'SWIPING_UP') {
      if (A.oldTh <= 0 || A.oldBy < -120) return;
      const fade = Math.max(0, Math.min(1, (A.oldBy + 40) / 60));
      if (fade <= 0.02) return;
      f = 1;
      tw = A.oldTw;
      th = A.oldTh;
      bx = A.oldBx|0;
      by = A.oldBy|0;
    } else {
      if(A.bubbleFrame === 0) return;
      f = A.bubbleFrame;
      tw = A.targetTw || 160;
      th = A.targetTh || 110;
      const w = Math.round(tw * Math.min(1.02, f));
      const h = Math.round(th * Math.min(1.02, f));
      if(w < 4 || h < 4) return;
      bx = (TBUB_R - w)|0;
      const anchorY = A.anchorY || 100;
      by = (anchorY - (h * 0.64))|0;
    }

    const w = Math.round(tw * Math.min(1.02, f));
    const h = Math.round(th * Math.min(1.02, f));
    by += A.scroll;   // slide down with the scroll-back view (0 in normal use)

    // Active celestial starlight border during the bloom, settling into calm border
    let activeBorder = (A.bubbleProgress < 0.6) ? '#829fd8' : ((A.bubbleProgress < 0.95) ? '#5c74b2' : border);
    let activeFill = fill;

    if (A.chatState === 'SWIPING_UP') {
      const fade = Math.max(0, Math.min(1, (A.oldBy + 40) / 60));
      if (fade < 0.95) {
        activeFill = `rgba(22,34,74,${fade.toFixed(2)})`;
        activeBorder = `rgba(51,67,122,${fade.toFixed(2)})`;
      }
    }

    /* Rounded rect body */
    rv(bx+2, by, w-4, h, activeFill);
    rv(bx, by+2, w, h-4, activeFill);
    rv(bx+1, by+1, w-2, h-2, activeFill);

    rv(bx+2, by-1, w-4, 1, activeBorder);
    rv(bx+2, by+h, w-4, 1, activeBorder);
    rv(bx-1, by+2, 1, h-4, activeBorder);
    rv(bx+w, by+2, 1, h-4, activeBorder);

    d(bx+1, by, activeBorder); d(bx, by+1, activeBorder);
    d(bx+w-2, by, activeBorder); d(bx+w-1, by+1, activeBorder);
    d(bx+1, by+h-1, activeBorder); d(bx, by+h-2, activeBorder);
    d(bx+w-2, by+h-1, activeBorder); d(bx+w-1, by+h-2, activeBorder);

    /* Tail pointing to toad's mouth (connects seamlessly during live speech; detaches during swipe up) */
    if(f >= 0.05 && A.scroll < 0.5 && A.chatState !== 'SWIPING_UP') {
      let tailStartTx = bx+w-2;
      let ty = 100;
      let bottomY = by + h - 1;

      let tx;

      if (bottomY <= ty) {
        // Bubble is pushed up safely above tail.
        let pipeTx = bx+w-16;
        let ch = ty - bottomY;

        // Vertical pipe connecting from the flat bottom edge
        rv(pipeTx, bottomY, 10, ch, fill);
        rv(pipeTx-1, bottomY, 1, ch + 4, activeBorder); // left border
        rv(pipeTx+10, bottomY, 1, ch, activeBorder);    // right border

        // Horizontal bridge linking pipe to original tail path
        let bridgeWidth = (tailStartTx + 10) - pipeTx;
        rv(pipeTx, ty, bridgeWidth, 3, fill);
        rv(pipeTx, ty+3, bridgeWidth, 1, activeBorder); // bottom border
        rv(pipeTx+11, ty-1, bridgeWidth - 11, 1, activeBorder); // top border

        tx = tailStartTx + 8;
      } else {
        // Bubble safely overlaps tail.
        tx = tailStartTx;
        rv(tx, ty, 10, 3, fill);
        rv(tx, ty-1, 10, 1, activeBorder);
        rv(tx, ty+3, 10, 1, activeBorder);
        tx += 8;
      }

      rv(tx, ty, 12, 3, fill);
      rv(tx, ty-1, 12, 1, activeBorder); rv(tx, ty+3, 12, 1, activeBorder);

      tx += 10;
      rv(tx, ty, 8, 2, fill);
      rv(tx, ty-1, 8, 1, activeBorder); rv(tx, ty+2, 8, 1, activeBorder);

      tx += 7;
      rv(tx, ty, 4, 1, fill);
      rv(tx, ty-1, 4, 1, activeBorder); rv(tx, ty+1, 4, 1, activeBorder);

      tx += 3;
      rv(tx, ty, 2, 1, activeBorder);
    }
  }

  /* ---------- 17. User Bubbles ---------- */
  function drawUserBubble(){
    const fill = TH.ubFill, border = TH.ubBorder;

    // 1. Draw Active Input Bubble
    if(A.userTh) {
      const w = 160;
      const h = A.userTh || 10;
      const bx = 10;
      const by = 170 - h;

      // Main Input Bubble Background
      rv(bx+2, by, w-4, h, fill);
      rv(bx, by+2, w, h-4, fill);
      rv(bx+1, by+1, w-2, h-2, fill);

      rv(bx+2, by-1, w-4, 1, border);
      rv(bx+2, by+h, w-4, 1, border);
      rv(bx-1, by+2, 1, h-4, border);
      rv(bx+w, by+2, 1, h-4, border);

      d(bx+1, by, border); d(bx, by+1, border);
      d(bx+w-2, by, border); d(bx+w-1, by+1, border);
      d(bx+1, by+h-1, border); d(bx, by+h-2, border);
      d(bx+w-2, by+h-1, border); d(bx+w-1, by+h-2, border);
    }

    // 2. Draw Old Sent Message Bubble (scrolling up and dissolving into the sky)
    if (A.chatState === 'SWIPING_UP' && A.oldUserText && A.oldUserTh > 0) {
      const oldFade = Math.max(0, Math.min(1, (A.oldUserBy + 25) / 35));
      if (oldFade > 0.02 && A.oldUserBy > -80) {
        const ow = 160;
        const oh = A.oldUserTh|0;
        const obx = 10;
        const oby = (A.oldUserBy + A.scroll)|0;
        const oFill = (oldFade < 0.95) ? `rgba(28,41,80,${oldFade.toFixed(2)})` : fill;
        const oBorder = (oldFade < 0.95) ? `rgba(58,76,134,${oldFade.toFixed(2)})` : border;

        rv(obx+2, oby, ow-4, oh, oFill);
        rv(obx, oby+2, ow, oh-4, oFill);
        rv(obx+1, oby+1, ow-2, oh-2, oFill);

        rv(obx+2, oby-1, ow-4, 1, oBorder);
        rv(obx+2, oby+oh, ow-4, 1, oBorder);
        rv(obx-1, oby+2, 1, oh-4, oBorder);
        rv(obx+ow, oby+2, 1, oh-4, oBorder);

        d(obx+1, oby, oBorder); d(obx, oby+1, oBorder);
        d(obx+ow-2, oby, oBorder); d(obx+ow-1, oby+1, oBorder);
        d(obx+1, oby+oh-1, oBorder); d(obx, oby+oh-2, oBorder);
        d(obx+ow-2, oby+oh-1, oBorder); d(obx+ow-1, oby+oh-2, oBorder);
      }
    }

    // 3. Draw Detached Sent Message Bubble (gliding up from bottom)
    if (A.sentText && A.sentTh > 0) {
      const sw = 160;
      const sh = A.sentTh|0;
      const sbx = 10;
      const sby = (A.sentBoxY + A.scroll)|0;

      // Active starlight border during the swipe up ascent:
      let activeBorder = border;
      if (A.chatState === 'SWIPING_UP') {
        if (A.swipeProgress < 0.60) {
          activeBorder = '#829fd8'; // luminous starlight cyan during ascent
        } else if (A.swipeProgress < 0.88) {
          activeBorder = '#5c74b2'; // cooling celestial indigo
        }
      }

      rv(sbx+2, sby, sw-4, sh, fill);
      rv(sbx, sby+2, sw, sh-4, fill);
      rv(sbx+1, sby+1, sw-2, sh-2, fill);

      rv(sbx+2, sby-1, sw-4, 1, activeBorder);
      rv(sbx+2, sby+sh, sw-4, 1, activeBorder);
      rv(sbx-1, sby+2, 1, sh-4, activeBorder);
      rv(sbx+sw, sby+2, 1, sh-4, activeBorder);

      d(sbx+1, sby, activeBorder); d(sbx, sby+1, activeBorder);
      d(sbx+sw-2, sby, activeBorder); d(sbx+sw-1, sby+1, activeBorder);
      d(sbx+1, sby+sh-1, activeBorder); d(sbx, sby+sh-2, activeBorder);
      d(sbx+sw-2, sby+sh-1, activeBorder); d(sbx+sw-1, sby+sh-2, activeBorder);
    }
  }

  /* =================================================================
     MAIN RENDER
     ================================================================= */
  function render(){
    G.clearRect(0,0,W,H);
    drawSky();                       // sky gradient (deep navy → hazy horizon)
    drawStars();                     // twinkling stars
    drawMoon(52,26);                 // crescent moon with a cool glow
    drawClouds(cloudsA);
    drawHills();                     // rolling hills on the horizon
    drawTrees();                     // distant tree silhouettes
    drawFence();                     // wooden fence along the horizon
    drawField();                     // green field ground
    drawGrass(grassB);               // background grass (behind the toad)
    drawFlowers();
    if (!MQ.matches) {
      drawToad();                    // toad on field
      drawThought();                 // thought animation above toad
    }
    drawGrass(grassF);               // foreground grass swaying in front of the toad
    drawAmbient();                   // cool moonlight wash + fireflies
    if (MQ.matches) {
      /* Mobile chat is pure DOM (#mobile-chat). The canvas bubble system
         (history + input frame + swipe-up sent bubble + toad reply bubble/tail)
         is desktop-only — drawing it here would bleed stray bubbles onto the
         scene band, since canvas pixels can't be hidden by the CSS that hides
         the DOM text overlays. */
      renderSceneTop();    // sky filling the screen above the field
      renderToadCorner();
      renderMobileThought();
    } else {
      drawHistory();
      drawUserBubble();
      drawBubble();
    }
  }

  /* =================================================================
     MAIN LOOP
     ================================================================= */
  function loop(ts){
    const s=ts/1000;
    if(!A.last) A.last=s;
    const dt=Math.min(s-A.last,0.06);
    A.last=s;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* =================================================================
     RESIZE
     ================================================================= */
  function resize(){
    // Canvas stretches edge-to-edge via CSS (100vw/100vh). The wrapper
    // is always fullscreen now — no letterboxing. DOM overlays are
    // positioned by update() using the wrapper's clientHeight.
  }
  window.addEventListener('resize',resize);
  resize();

  requestAnimationFrame(loop);

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
    );
  }

  function formatMessage(text) {
    let safe = escapeHTML(text);
    // Strip all newlines so the text flows perfectly smoothly as one continuous block
    safe = safe.replace(/\n+/g, ' ');
    safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a class="content-link" href="$2" target="_blank">$1</a>');
    safe = safe.replace(/\*+([^\*]+)\*+/g, '<strong class="md-b">$1</strong>');
    return safe;
  }

  function showText(text) {
    if(!text) {
      A.bubbleTarget = 0;
      A.bubbleProgress = 0;
      A.bubbleFrame = 0;
      return;
    }
    const bText = document.getElementById('bubbleText');
    bText.innerHTML = '<div>' + formatMessage(text) + '</div>';

    bText.style.display = 'flex';
    bText.style.flexDirection = 'column';
    bText.style.justifyContent = 'center';
    bText.style.paddingTop = '';   // measure pure text height (drop any prior overflow padding)
    bText.style.width = 'fit-content';
    bText.style.height = 'fit-content';
    bText.style.maxWidth = ((160 / W) * 100) + '%';

    const wrapperH = document.getElementById('canvasWrapper').clientHeight;
    const scaleY = wrapperH / H;
    bText.style.fontSize = (6.5 * scaleY) + 'px';

    const rect = bText.getBoundingClientRect();
    const canvasW = C.clientWidth;
    const canvasH = C.clientHeight;

    let calcTw = (rect.width / canvasW) * W;
    let calcTh = (rect.height / canvasH) * H;

    bText.style.display = 'none';

    A.targetTw = 160; // Always matching user bubble width
    A.requestedTh = Math.max(12, calcTh + 4);
    A.bubbleTarget = 1;
    A.bubbleProgress = 0;
    A.bubbleTimer = 0;
  }

  document.getElementById('userInput').addEventListener('input', (e) => {
    const el = e.target;
    const oldHeight = el.style.height;
    el.style.height = '1px';
    const canvasH = document.getElementById('canvasWrapper').clientHeight;
    A.calcUTh = (el.scrollHeight / canvasH) * H;
    el.style.height = oldHeight;
  });

  const uInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  /* ---- Mobile chat log (portrait phones) ----
     Each send rides in as a fresh `.mobile-exchange` at the very bottom of
     #mobile-chat; it rises up from the bottom edge and pushes older exchanges
     upward out of view (scroll up to read them). The user message sits on top,
     the toad's reply is appended beneath it in the same container. On desktop
     these never run (the callers are guarded by `MQ.matches`),
     so the canvas swipe-up system is untouched. */
  const mobileChat = document.getElementById('mobile-chat');
  let mobileExchange = null;    // container for the in-progress exchange

  function mobileScrollBottom() {
    mobileChat.scrollTo({ top: mobileChat.scrollHeight, behavior: 'smooth' });
  }
  // True when the user is parked at (or near) the newest message rather than
  // scrolled up reading history — used to avoid yanking them down on a reply.
  function mobilePinnedBottom() {
    return mobileChat.scrollHeight - mobileChat.scrollTop - mobileChat.clientHeight < 48;
  }
  // Bring a toad reply's TOP edge to the top of the log (with the same 12px gap
  // as the container padding) so the reader starts at the beginning of the
  // message, not its end. Browser clamps scrollTop for short/last replies.
  function mobileScrollToTop(el) {
    const cTop = mobileChat.getBoundingClientRect().top;
    const eTop = el.getBoundingClientRect().top;
    mobileChat.scrollTop += (eTop - cTop) - 12;
  }

  function mobileAppend(text, role) {
    const msg = document.createElement('div');
    msg.className = 'mobile-msg ' + role;
    if (role === 'user') {
      msg.textContent = text;
      mobileExchange = document.createElement('div');
      mobileExchange.className = 'mobile-exchange';
      mobileExchange.appendChild(msg);
      mobileChat.appendChild(mobileExchange);
    } else {
      msg.innerHTML = '<div>' + formatMessage(text) + '</div>';
      (mobileExchange || mobileChat).appendChild(msg);
    }
    mobileScrollBottom();   // keep the newest message in view at the bottom
    return msg;
  }

  function dispatchMessage() {
    if (A.chatState === 'SWIPING_UP') return;

    const text = uInput.value.trim();
    if (!text) return;

    A.scroll = 0; A.scrollTarget = 0;   // a new exchange snaps back to the live view

    // 1. Snapshot previous user message (if one is currently at top)
    if (A.sentText) {
      A.oldUserText = A.sentText;
      A.oldUserTh = A.sentTh;
      A.oldUserByStart = A.sentBoxY;
      A.oldUserBy = A.oldUserByStart;
    } else {
      A.oldUserText = null;
      A.oldUserTh = 0;
    }

    // 2. Snapshot previous toad bubble (if one is currently visible)
    if (A.bubbleFrame > 0.02 || (A.targetTh > 0 && A.pendingReply)) {
      A.oldTw = A.targetTw || 160;
      A.oldTh = (A.targetTh || A.requestedTh || 110) * Math.max(0.2, A.bubbleFrame);
      A.oldByStart = (A.anchorY || 100) - (A.oldTh * 0.64);
      A.oldBy = A.oldByStart;
      A.oldBx = TBUB_R - A.oldTw;
    } else {
      A.oldTh = 0;
    }

    // 3. Set up detached sent message DOM
    const sentMsgDom = document.getElementById('sentMessage');
    sentMsgDom.innerText = text;

    const canvasH = document.getElementById('canvasWrapper').clientHeight;
    const scaleY = canvasH / H;

    sentMsgDom.style.display = 'flex';
    sentMsgDom.style.flexDirection = 'column';
    sentMsgDom.style.justifyContent = 'center';
    sentMsgDom.style.width = ((160 / W) * 100) + '%';
    sentMsgDom.style.height = 'fit-content';
    sentMsgDom.style.fontSize = (6.5 * scaleY) + 'px';

    // Measure layout synchronously
    const sRect = sentMsgDom.getBoundingClientRect();
    A.sentRequestedTh = Math.max(10, Math.min(45, (sRect.height / canvasH) * H + 4));
    A.sentTh = A.sentRequestedTh;

    A.sentText = text;
    A.sentBoxYStart = 168 - A.sentRequestedTh;
    A.sentBoxY = A.sentBoxYStart;
    A.swipeProgress = 0;
    A.chatState = 'SWIPING_UP';
    A.pendingReply = null;

    uInput.value = '';
    uInput.dispatchEvent(new Event('input'));

    if (!window.chatHistory) window.chatHistory = [];
    window.chatHistory.push({ role: "user", parts: [{ text: text }] });
    recordMessage('user', text);

    // Mobile: push exchange directly into the mobile chat log (no premature "..." bubble)
    if (MQ.matches) {
      mobileAppend(text, 'user');
    }

    /* Deploy-safe: the API key lives server-side in /api/chat (env var),
       never in the browser. We only send the conversation; the proxy picks
       the model (Gemini 3 Flash) and adds the system prompt, search tool
       and safety settings. */
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: window.chatHistory })
    })
    .then(async res => {
      const cType = res.headers.get('content-type') || '';
      if (!cType.includes('application/json')) {
        if (res.status === 404) {
          throw new Error('The /api/chat server is unreachable. Please run "node local-server.js" instead of a static server like "serve".');
        }
        const bodyPreview = await res.text();
        throw new Error(`Server returned HTTP ${res.status}: ${bodyPreview.slice(0, 100)}`);
      }
      return res.json();
    })
    .then(data => {
      if (data.error) {
        const errText = `Error: ${data.error}`;
        recordMessage('model', errText);
        if (A.chatState === 'SWIPING_UP') {
          A.pendingReply = errText;
        } else {
          A.thinking = false;
          A.transPhase = 'CONDENSING';
          A.transTimer = 0;
          A.pendingReply = errText;
        }
        return;
      }
      const replyText = data.reply || "Silence...";
      window.chatHistory.push({ role: "model", parts: [{ text: replyText }] });
      recordMessage('model', replyText);

      // Seamless transition to speech
      if (A.chatState === 'SWIPING_UP') {
        A.pendingReply = replyText;
      } else {
        A.thinking = false;
        A.transPhase = 'CONDENSING';
        A.transTimer = 0;
        A.pendingReply = replyText;
      }
    })
    .catch(err => {
      const m = `The connection to the cosmos was interrupted: ${err.message}`;
      recordMessage('model', m);
      if (A.chatState === 'SWIPING_UP') {
        A.pendingReply = m;
      } else {
        A.thinking = false;
        A.transPhase = 'CONDENSING';
        A.transTimer = 0;
        A.pendingReply = m;
      }
    });
  }

  sendBtn.addEventListener('click', dispatchMessage);
  uInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      dispatchMessage();
    }
  });

  /* =================================================================
     PREVIOUS EXCHANGES  (additive — same boxes, scrolled back into view)
     The live swipe-up chat above is untouched; its boxes are merely shifted
     by A.scroll (which is 0 in normal use). Every turn is recorded into
     `transcript` with a hidden DOM text box in the SAME format as the live
     ones (#histLayer; the pixel bubble behind each is drawn on the canvas
     by drawHistory). Scrolling UP — anywhere except over the input or the
     toad's reply — eases A.scroll up: the on-screen boxes slide down and the
     earlier exchanges (the ones that swiped up off the top when you sent)
     slide back into view above. Scrolling back down eases A.scroll to 0.
     ================================================================= */
  const transcript = [];                 // { role, text, el, h, _y }   h/_y in grid units
  const histLayer = document.getElementById('histLayer');
  const HGAP = 6;                         // grid units between stacked boxes

  function recordMessage(role, text){
    if (!text || text === '...') return;
    role = (role === 'user') ? 'user' : 'toad';
    const el = document.createElement('div');
    el.className = 'histMsg';
    if (role === 'user') el.textContent = text;
    else el.innerHTML = '<div>' + formatMessage(text) + '</div>';
    el.style.left   = (((role === 'user' ? 10 : THIST_X) / W) * 100) + '%';
    el.style.width  = ((160 / W) * 100) + '%';
    el.style.height = 'auto';
    el.style.display = 'flex';
    el.style.fontSize = (6.5 * (A.scaleY || 1)) + 'px';
    histLayer.appendChild(el);
    const wrapperH = document.getElementById('canvasWrapper').clientHeight || H;
    const h = (el.getBoundingClientRect().height / wrapperH) * H + 4;   // +4: same breathing room as the live bubbles
    el.style.display = 'none';
    transcript.push({ role, text, el, h, _y: 0 });
  }

  /* index of the latest user message — everything before it is "history" */
  function historyCount(){
    for (let i = transcript.length - 1; i >= 0; i--)
      if (transcript[i].role === 'user') return i;   // messages [0 .. i-1]
    return 0;
  }

  /* stack the history boxes upward, just above the live sent message */
  function layoutHistory(){
    const n = historyCount();
    let yb = (A.sentText ? A.sentBoxY : 170) - HGAP;   // bottom of the most-recent history box
    for (let i = n - 1; i >= 0; i--){
      transcript[i]._y = yb - transcript[i].h;
      yb = transcript[i]._y - HGAP;
    }
    A.maxScroll = n > 0 ? Math.max(0, 6 - transcript[0]._y) : 0;
    return n;
  }

  /* place + show the history DOM text every frame (canvas bg drawn in render) */
  function syncHistory(){
    const n = layoutHistory();
    const showing = A.scroll > 0.5;
    for (let i = 0; i < transcript.length; i++){
      const m = transcript[i];
      if (showing && i < n){
        m.el.style.display  = 'flex';
        m.el.style.top      = (((m._y + A.scroll) / H) * 100) + '%';
        m.el.style.height   = ((m.h / H) * 100) + '%';
        m.el.style.fontSize = (6.5 * A.scaleY) + 'px';
      } else {
        m.el.style.display = 'none';
      }
    }
  }

  /* pixel bubble background for a history box — identical to the live boxes */
  function drawHistBox(bx, by, w, h, fill, border){
    rv(bx+2, by, w-4, h, fill);
    rv(bx, by+2, w, h-4, fill);
    rv(bx+1, by+1, w-2, h-2, fill);
    rv(bx+2, by-1, w-4, 1, border);
    rv(bx+2, by+h, w-4, 1, border);
    rv(bx-1, by+2, 1, h-4, border);
    rv(bx+w, by+2, 1, h-4, border);
    d(bx+1, by, border); d(bx, by+1, border);
    d(bx+w-2, by, border); d(bx+w-1, by+1, border);
    d(bx+1, by+h-1, border); d(bx, by+h-2, border);
    d(bx+w-2, by+h-1, border); d(bx+w-1, by+h-2, border);
  }

  function drawHistory(){
    if (A.scroll <= 0.5) return;
    const n = historyCount();
    for (let i = 0; i < n; i++){
      const m = transcript[i];
      const fill   = m.role === 'user' ? TH.ubFill : TH.tbFill;
      const border = m.role === 'user' ? TH.ubBorder : TH.tbBorder;
      const hx     = m.role === 'user' ? 10 : THIST_X;
      drawHistBox(hx, Math.round(m._y + A.scroll), 160, Math.round(m.h), fill, border);
    }
  }

  /* the two "text hitboxes" that keep their own scroll: the input + the toad's reply */
  const isTextHitbox = (t) => !!(t && t.closest && t.closest('#userInput, #bubbleText'));

  window.addEventListener('wheel', (e) => {
    if (isTextHitbox(e.target)) return;
    if (A.maxScroll <= 0 && A.scrollTarget <= 0) return;
    const before = A.scrollTarget;
    A.scrollTarget = Math.max(0, Math.min(A.maxScroll, A.scrollTarget - e.deltaY / (A.scaleY || 1)));
    if (A.scrollTarget !== before) e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') A.scrollTarget = 0; });
})();
</script>
</body>
</html>
